[package]
name = "algosul-core"
version.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
license-file.workspace = true
edition.workspace = true
description.workspace = true
readme.workspace = true

[features]
default = []

std = ["serde/std", "thiserror/std", "uuid/std"]
unstable = []
unstable-full = ["unstable", "__feature-const_trait_impl"]

__feature-const_trait_impl = ["unstable"]

serde = ["dep:serde"]

i18n = ["dep:unic-langid", "dep:unic-langid-impl"]
i18n-fluent = ["i18n", "dep:fluent"]

util-derive = ["std", "dep:proc-macro2", "dep:proc-macro-warning", "dep:quote", "dep:syn"]

module = ["std"]

message = ["module"]

[package.metadata.docs.rs]
rustdoc-args = ["-cfg", "docsrs"]

[dependencies]
serde = { workspace = true, optional = true }
thiserror.workspace = true
fluent = { workspace = true, public = true, optional = true }
unic-langid = { workspace = true, public = true, optional = true }
unic-langid-impl = { workspace = true, public = true, optional = true }
uuid = { workspace = true, optional = true }
proc-macro2 = { workspace = true, public = true, optional = true }
proc-macro-warning = { workspace = true, public = true, optional = true }
quote = { workspace = true, public = true, optional = true }
syn = { workspace = true, public = true, optional = true }
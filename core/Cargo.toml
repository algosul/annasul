[package]
name = "algosul-core"
version.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
license-file.workspace = true
edition.workspace = true
description.workspace = true
readme.workspace = true

[features]
default = []
std = []
unstable = []
serde = ["dep:serde"]

i18n = ["dep:unic-langid", "dep:unic-langid-impl"]
i18n-fluent = ["i18n", "dep:fluent"]

[package.metadata.docs.rs]
rustdoc-args = ["-cfg", "docsrs"]

[dependencies]
serde = { workspace = true, optional = true }
thiserror.workspace = true
fluent = { workspace = true, public = true, optional = true }
unic-langid = { workspace = true, public = true, optional = true }
unic-langid-impl = { workspace = true, public = true, optional = true }
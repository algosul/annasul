[package]
name = "algosul-derive"
version = "0.0.5"
authors.workspace = true
repository.workspace = true
keywords.workspace = true
license-file.workspace = true
edition.workspace = true
description.workspace = true
readme.workspace = true
build = "build.rs"

[lib]
proc-macro = true

[features]
default = []

[package.metadata.docs.rs]
rustdoc-args = ["-cfg", "docsrs"]

[dependencies]
env_logger.workspace = true
proc-macro2 = { workspace = true, features = [], public = true }
quote = { workspace = true, public = true }
syn = { workspace = true, features = ["full"], public = true }
log.workspace = true
algosul-core = { workspace = true }
 
[package]
name = "algosul-math"
version.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
license-file.workspace = true
edition.workspace = true
description.workspace = true
readme.workspace = true

[features]
default = []

std = ["algosul-core/std"]
std-unstable-matrix = [
    "std",
    "unstable",
    "__feature-portable_simd",
    "__feature-algosul-wrapper",
    "__feature-const_trait_impl"
]
std-unstable-vector = [
    "std",
    "unstable",
    "__feature-portable_simd",
    "__feature-algosul-wrapper",
    "__feature-const_trait_impl"
]
std-unstable-color = [
    "std",
    "unstable",
    "__feature-portable_simd",
    "__feature-algosul-wrapper",
    "__feature-const_trait_impl"
]
std-unstable-shape = [
    "std",
    "unstable",
    "std-unstable-vector",
    "__feature-portable_simd",
    "__feature-algosul-wrapper",
    "__feature-const_trait_impl"
]

unstable = []
unstable-full = [
    "unstable",
    "std-unstable-matrix",
    "std-unstable-vector",
    "std-unstable-color",
    "std-unstable-shape",
]

__feature-portable_simd = ["unstable"]
__feature-algosul-wrapper = ["unstable", "algosul-core/wrapper", "algosul-derive/wrapper", "algosul-derive/unstable"]
__feature-const_trait_impl = ["unstable", "algosul-core/__feature-const_trait_impl"]

serde = []

[dependencies]
algosul-core = { workspace = true, public = true }
algosul-derive = { workspace = true, public = true }
num = { workspace = true, public = true }
num-traits = { workspace = true, public = true }
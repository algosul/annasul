[workspace]
resolver = "3"
members = [".", "ai", "derive", "core", "math", "task", "develop/ui/rust-serde-type-editor"]
[workspace.package]
version = "0.0.17"
authors = ["algosul <hxb.air@gmail.com>"]
repository = "https://github.com/algosul/algosul-rs"
keywords = ["algosul"]
license-file = "LICENSE"
edition = "2024"
description = "Some user-friendly yet personalized tools"
readme = "README.md"

[workspace.dependencies]
algosul-core = { version = "0.0.17", path = "core", default-features = false }
algosul-math = { version = "0.0.17", path = "math", default-features = false }
algosul-derive = { version = "0.0.17", path = "derive", default-features = false }
image = "0.25.6"
strfmt = "0.2.5"
env_logger = "0.11.8"
log = "0.4.27"
toml = "1.1.2"
serde = { version = "1.0.219", default-features = false }
bytes = "1.10.1"
tokio = "1.46.1"
rayon = "1.10.0"
itertools = "0.14.0"
regex = "1.11.1"
thiserror = { version = "2.0.18", default-features = false }
rfd = "0.17.2"
strum = "0.28.0"
glob = "0.3.3"
quote = "1.0.46"
proc-macro2 = "1.0.101"
proc-macro-warning = "1.0"
syn = { version = "2.0.106", features = ["full"] }
fluent = "0.17.0"
unic-langid = "0.9.6"
unic-langid-impl = "0.9.6"
uuid = { version = "1.23.1", default-features = false }
num = "0.4.3"
num-traits = "0.2.19"
wincode = "0.6.1"
rkyv = "0.8.18"
gtk4 = "0.11.4"
glib = "0.22.8"

[package]
name = "algosul"
version.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
license-file.workspace = true
edition.workspace = true
description.workspace = true
readme.workspace = true
build = "build.rs"
autotests = false
autobins = false
autobenches = false
autoexamples = false
exclude = ["/docs/"]

[lib]
name = "algosul"

[features]
default = []

std = ["algosul-core/std"]
std-unstable-vector = ["algosul-math/std-unstable-vector"]
std-unstable-color = ["algosul-math/std-unstable-color"]

unstable = ["algosul-core/unstable"]
unstable-full = ["algosul-core/unstable-full", "algosul-math/unstable-full"]

serde = ["algosul-core/serde", "algosul-math/serde"]

derive = ["dep:algosul-derive"]

[package.metadata.docs.rs]
rustdoc-args = ["-cfg", "docsrs"]

[dependencies]
algosul-core = { workspace = true, public = true }
algosul-math = { workspace = true, public = true }
algosul-derive = { workspace = true, public = true, optional = true }

[build-dependencies]
env_logger = { workspace = true, features = [] }

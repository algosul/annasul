[workspace]
resolver = "3"
members = [".", "ai", "core"]
[workspace.package]
version = "0.0.17"
authors = ["algosul <hxb.air@gmail.com>"]
repository = "https://github.com/algosul/algosul-rs"
keywords = ["algosul"]
license-file = "LICENSE"
edition = "2024"
description = "Some user-friendly yet personalized tools"
readme = "README.md"

[workspace.dependencies]
algosul-core = { version = "0.0.17", path = "core", default-features = false }
image = "0.25.6"
strfmt = "0.2.5"
env_logger = "0.11.8"
log = "0.4.27"
toml = "1.1.2"
serde = "1.0.219"
bytes = "1.10.1"
tokio = "1.46.1"
rayon = "1.10.0"
itertools = "0.14.0"
regex = "1.11.1"
thiserror = "2.0.18"
rfd = "0.17.2"
strum = "0.28.0"
glob = "0.3.3"
proc-macro2 = "1.0.101"
syn = "2.0.106"
fluent = "0.17.0"
unic-langid = "0.9.6"
unic-langid-impl = "0.9.6"
uuid = "1.23.1"

[package]
name = "algosul"
version.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
license-file.workspace = true
edition.workspace = true
description.workspace = true
readme.workspace = true
build = "build.rs"
autotests = false
autobins = false
autobenches = false
autoexamples = false
exclude = ["/docs/"]

[lib]
name = "algosul"

[features]
default = []

std = ["algosul-core/std"]
unstable = ["algosul-core/unstable"]
serde = ["algosul-core/serde"]

core-util = ["algosul-core/util"]
core-util-async = ["algosul-core/util-async"]
core-util-std = ["algosul-core/util-std"]


[package.metadata.docs.rs]
rustdoc-args = ["-cfg", "docsrs"]

[dependencies]
algosul-core = { workspace = true, public = true }

[build-dependencies]
env_logger = { workspace = true, features = [] }
